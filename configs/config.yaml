# Model Configuration
model:
  base_model_path: "models/Qwen2.5-1.5B-Instruct"  # Path to base model
  current_model_path: "models/current_model"      # Path to the iteratively updated model
  model_family: "Qwen2.5"
  size: "1.5B"

# Fine-tuning Hyperparameters (QLoRA)
training:
  method: "4bit-QLoRA"
  batch_size: 16
  context_length: 32
  learning_rate: 1e-4
  num_train_epochs: 20
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  train_set_size: 32
  val_set_size: 8
  test_set_size: 8
  eval_steps: 4
  early_stopping_patience: 3
  early_stopping_threshold: 0.01

# Dataset Configuration
dataset:
  name: "Fineweb-Edu-Chinese-V2.2"
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"
  use_processed_data: true

# Logging
logging:
  use_wandb: false
  project_name: "QEdpediaCN-Qwen"
  output_dir: "outputs"
