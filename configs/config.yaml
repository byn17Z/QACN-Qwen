# Model Configuration
model:
  base_model_path: "models/Qwen2.5-3B-Instruct"  # Path to base model
  current_model_path: "models/current_model"      # Path to the iteratively updated model
  model_family: "Qwen2.5"
  size: "3B"

# Fine-tuning Hyperparameters (QLoRA)
training:
  method: "4bit-QLoRA"
  batch_size: 128
  context_length: 1024
  learning_rate: 1e-4
  num_train_epochs: 20
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  train_set_size: 4096
  val_set_size: 512
  test_set_size: 512
  eval_steps: 100
  early_stopping_patience: 3
  early_stopping_threshold: 0.01

# Dataset Configuration
dataset:
  name: "Fineweb-Edu-Chinese-V2.2"
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"

# Logging
logging:
  use_wandb: true
  project_name: "QEdpediaCN-Qwen"
  output_dir: "outputs"
