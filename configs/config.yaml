# Model Configuration
model:
  base_model_path: "models/Qwen2.5-1.5B-Instruct"  # Path to base model
  current_model_path: "models/current_model"      # Path to the iteratively updated model
  model_family: "Qwen2.5"
  size: "1.5B"

# Fine-tuning Hyperparameters (QLoRA)
training:
  method: "4bit-QLoRA"
  batch_size: 16
  context_length: 32
  learning_rate: 1e-4
  num_train_epochs: 20
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  train_set_size: 32
  val_set_size: 8
  test_set_size: 8
  eval_steps: 4
  early_stopping_patience: 3
  early_stopping_threshold: 0.01

# Dataset Configuration
dataset:
  name: "Fineweb-Edu-Chinese-V2.2"
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"
  use_processed_data: true
  use_distilled_data: false           # true = training uses distilled_output instead of output

# Knowledge Distillation Configuration
distill:
  enabled: false                      # true = run distillation stage in pipeline
  api_base_url: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"     # env var name holding the API key
  model: "deepseek-v4-pro"            # "deepseek-v4-pro" or "deepseek-v4-flash"
  thinking_mode: true                 # capture reasoning_content from teacher
  reasoning_effort: "high"            # "high" or "max"

  # Data paths
  raw_data_dir: "data/raw"
  distilled_data_path: "data/processed/distilled_data.jsonl"
  checkpoint_path: "data/processed/distill_checkpoint.json"

  # Concurrency and rate limiting
  max_concurrent: 5                   # semaphore limit for parallel API calls
  max_retries: 5                      # retries per request on 429/5xx
  base_backoff: 1.0                   # initial backoff seconds (doubles each retry)
  max_backoff: 60.0                   # backoff cap
  request_timeout: 120                # per-request timeout in seconds

  # Distillation scope
  sample_size: 0                      # 0 = use all raw data; >0 = random sample
  seed: 42                            # for reproducible sampling

  # Cost logging
  cost_log_path: "data/processed/distill_cost.json"

# RAG Configuration
rag:
  # Paths
  embedder_path: "rag/models/bge-small-zh-v1.5"
  reranker_path: "rag/models/bge-reranker-base"
  db_path: "rag/db"

  # Retrieval params
  retrieve_top_k: 20         # candidates from embedding search
  retrieve_top_n: 5          # final results after reranking

  # Pipeline flags
  build_rag_db: true         # true = rebuild DB from sft_data.jsonl; false = load existing DB
  rag_inference_deploy: false # integrate RAG when deploying
  context_mask_test: false    # hide context during testing
  rag_inference_test: false   # true = use RAG docs; false = use labeled context; ignored if context_mask_test=true
  context_mask_train: false   # hide context during training
  rag_inference_train: false  # true = use RAG docs; false = use labeled context; ignored if context_mask_train=true

# Deployment Configuration
deploy:
  host: "0.0.0.0"
  port: 8000
  quantization: "4bit"              # "4bit" (BitsAndBytes NF4) or "none" (bf16/fp16)
  model_path_override: ""           # if non-empty, use this path instead of current_model_path
  rag_enabled_default: false        # default RAG mode for Gradio UI
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  do_sample: true

# Logging
logging:
  use_wandb: false
  project_name: "QEdpediaCN-Qwen"
  output_dir: "outputs"
